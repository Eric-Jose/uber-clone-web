name: Patch ride dispatch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message != 'fix(ride): prioritize HTTP dispatch when Socket.IO is unavailable' && github.event.head_commit.message != 'chore(ci): remove temporary dispatch patch workflow' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch backend dispatch fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/routes/rides.js')
          text = path.read_text(encoding='utf-8')
          old = """    const ageMs = Math.max(0, Date.now() - Number(ride.createdAt || Date.now())), radiusKm = dispatchRadiusKm(ageMs), drivers = await findEligibleDrivers(ride.origin, radiusKm);\n    for (const driver of drivers.slice(0, 10)) {"""
          new = """    const ageMs = Math.max(0, Date.now() - Number(ride.createdAt || Date.now())), radiusKm = dispatchRadiusKm(ageMs), drivers = await findEligibleDrivers(ride.origin, radiusKm);\n    if (!io || !io.sockets?.adapter?.rooms) {\n      await notifyDriversHttpFallback(ride);\n      return;\n    }\n    for (const driver of drivers.slice(0, 10)) {"""
          if old not in text:
              raise SystemExit('dispatch pattern not found; aborting without changes')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('Ride dispatch fallback patch applied.')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/routes/rides.js
          git commit -m 'fix(ride): prioritize HTTP dispatch when Socket.IO is unavailable'
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/patch-dispatch.yml
          git commit -m 'chore(ci): remove temporary dispatch patch workflow'
          git push
