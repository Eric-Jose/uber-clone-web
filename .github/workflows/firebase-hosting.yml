name: Deploy PreçoFixo17 Web to Firebase Hosting

on:
  push:
    branches: [main]
    paths-ignore:
      - 'mobile/**'
      - '.github/workflows/build-precofixo17-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pin npm compatible with CRA 5
        run: npm install --global npm@8.19.4

      - name: Install dependencies
        env:
          npm_config_legacy_peer_deps: 'true'
          npm_config_audit: 'false'
          npm_config_fund: 'false'
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Verify dependency tree used by CRA
        run: |
          node -v
          npm -v
          node -e "for (const p of ['react-scripts','webpack','terser-webpack-plugin','schema-utils','ajv','ajv-keywords']) { try { console.log(p, require(p + '/package.json').version) } catch (e) { console.error('missing ' + p); process.exitCode = 1 } }"

      - name: Build React app
        env:
          REACT_APP_BACKEND_URL: https://uber-clone-backend-eric-jose.vercel.app
          REACT_APP_FIREBASE_API_KEY: ${{ secrets.REACT_APP_FIREBASE_API_KEY }}
          REACT_APP_FIREBASE_AUTH_DOMAIN: ${{ secrets.REACT_APP_FIREBASE_AUTH_DOMAIN }}
          REACT_APP_FIREBASE_PROJECT_ID: ${{ secrets.REACT_APP_FIREBASE_PROJECT_ID }}
          REACT_APP_FIREBASE_STORAGE_BUCKET: ${{ secrets.REACT_APP_FIREBASE_STORAGE_BUCKET }}
          REACT_APP_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.REACT_APP_FIREBASE_MESSAGING_SENDER_ID }}
          REACT_APP_FIREBASE_APP_ID: ${{ secrets.REACT_APP_FIREBASE_APP_ID }}
        run: npm run build

      - name: Setup Firebase CLI
        run: npm install --global firebase-tools

      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Deploy Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only hosting --project uber-clone-eric-f4327 --non-interactive

      - name: Setup Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN"
          vercel pull --yes --environment=production --token "$VERCEL_TOKEN" --scope eric-jose
          vercel build --prod --token "$VERCEL_TOKEN" --scope eric-jose
          vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" --scope eric-jose --yes
