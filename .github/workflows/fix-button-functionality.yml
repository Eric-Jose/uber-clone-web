name: Fix PreçoFixo17 button functionality
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch navigation and buttons
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const edits = [
            {
              path: 'src/App.js',
              from: '<UserProfile user={user} onLogout={handleLogout} onRequestRide={() => setCurrentPage(\'ride\')} onHistory={() => setCurrentPage(\'ride-history\')} />',
              to: '<UserProfile user={user} onLogout={handleLogout} onBack={() => setCurrentPage(\'ride\')} onNavigate={navigate} onRequestRide={() => setCurrentPage(\'ride\')} onHistory={() => setCurrentPage(\'ride-history\')} />'
            },
            {
              path: 'src/App.js',
              from: '<Promotions userId={user?.uid || user?.id} onApplyCode={() => {}} />',
              to: '<Promotions userId={user?.uid || user?.id} onApplyCode={(promo) => { if (promo?.code) localStorage.setItem(\'pf_selected_promo\', String(promo.code)); }} />'
            },
            {
              path: 'src/App.js',
              from: '<NotificationCenter />',
              to: '<NotificationCenter onBack={() => setCurrentPage(\'ride\')} />'
            },
            {
              path: 'src/pages/MapRidePro.js',
              from: "  const [promoCode, setPromoCode] = useState('Nenhuma');",
              to: "  const [promoCode, setPromoCode] = useState(() => { try { return localStorage.getItem('pf_selected_promo') || 'Nenhuma'; } catch (_) { return 'Nenhuma'; } });"
            },
            {
              path: 'src/pages/UserProfile.js',
              from: "  const [savedAddresses, setSavedAddresses] = useState([\n    { id: 1, label: 'Casa', address: 'Av. das Palmeiras, 123 - Centro' },\n    { id: 2, label: 'Trabalho', address: 'Rua dos Ipês, 456 - Jardim das Flores' }\n  ]);",
              to: "  const [savedAddresses] = useState([\n    { id: 1, label: 'Casa', address: 'Av. das Palmeiras, 123 - Centro' },\n    { id: 2, label: 'Trabalho', address: 'Rua dos Ipês, 456 - Jardim das Flores' }\n  ]);"
            },
            {
              path: 'src/pages/UserProfile.js',
              from: "  const [activeModal, setActiveModal] = useState(null); // 'info' | 'address' | 'saved'\n",
              to: ''
            },
            {
              path: 'src/pages/UserProfile.js',
              from: "              if (newName && newName.trim()) {\n                setUserData((prev) => ({ ...prev, name: newName.trim() }));\n              }",
              to: "              if (newName && newName.trim()) {\n                const nextName = newName.trim();\n                setUserData((prev) => ({ ...prev, name: nextName }));\n                try {\n                  const stored = JSON.parse(localStorage.getItem('user') || '{}');\n                  localStorage.setItem('user', JSON.stringify({ ...stored, name: nextName }));\n                } catch (_) {}\n              }"
            },
            {
              path: 'src/pages/UserProfile.js',
              from: "            onClick={() => alert('Central de Ajuda PreçoFixo17: suporte disponível 24h pelo WhatsApp.')}",
              to: "            onClick={() => onNavigate?.('help')}"
            }
          ];
          for (const edit of edits) {
            let s = fs.readFileSync(edit.path, 'utf8');
            if (edit.to && s.includes(edit.to)) continue;
            if (!s.includes(edit.from)) throw new Error('Patch anchor not found: ' + edit.path + ' :: ' + edit.from.slice(0, 80));
            s = s.replace(edit.from, edit.to);
            fs.writeFileSync(edit.path, s);
          }
          NODE
      - name: Build frontend
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-button-functionality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.js src/pages/MapRidePro.js src/pages/UserProfile.js .github/workflows/fix-button-functionality.yml
          git diff --cached --quiet || git commit -m "fix(ui): connect navigation and page buttons"
          git push origin HEAD:main
