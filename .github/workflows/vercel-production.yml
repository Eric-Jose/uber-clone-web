name: Deploy PreçoFixo17 to Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel and verify backend is on this commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -e
          echo "Waiting for Vercel production to publish commit $EXPECTED_COMMIT..."
          for attempt in $(seq 1 36); do
            response=$(curl -fsS https://uber-clone-web.vercel.app/api/backend-check || true)
            echo "Attempt $attempt: $response"
            if echo "$response" | grep -q '"status":"ok"' \
              && echo "$response" | grep -q '"backendInitialized":true' \
              && echo "$response" | grep -q '"firebaseInitialized":true' \
              && echo "$response" | grep -q '"databaseConfigured":true' \
              && echo "$response" | grep -q '"databaseURLValid":true' \
              && echo "$response" | grep -q "\"deploymentCommit\":\"$EXPECTED_COMMIT\""; then
              echo "Production backend is healthy and synchronized with $EXPECTED_COMMIT."
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: Vercel production backend did not publish the GitHub commit $EXPECTED_COMMIT within the expected window."
          exit 1
