name: Deploy PreçoFixo17 to Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Vercel production backend
        run: |
          set -e
          echo "Checking Vercel production backend..."
          response=$(curl -fsS --retry 5 --retry-delay 3 https://uber-clone-web.vercel.app/api/backend-check)
          echo "$response"
          echo "$response" | grep -q '"status":"ok"'
          echo "$response" | grep -q '"backendInitialized":true'
          echo "$response" | grep -q '"firebaseInitialized":true'
          echo "$response" | grep -q '"databaseConfigured":true'
          echo "$response" | grep -q '"databaseURLValid":true'
          echo "Production backend is healthy. Vercel Git Integration handles the deployment from main."
