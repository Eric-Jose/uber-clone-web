name: Repair AccountPanel children

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[auto-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair React children cloning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.js')
          text = path.read_text(encoding='utf-8')
          old = """        {React.cloneElement(children, {\n          onOpenMenu: () => setMenuOpen(true),\n          onOpenNotifications: () => onNavigate('notifications'),\n          onNavigate: onNavigate\n        })}"""
          new = """        {React.Children.map(children, (child) =>\n          React.isValidElement(child)\n            ? React.cloneElement(child, {\n                onOpenMenu: () => setMenuOpen(true),\n                onOpenNotifications: () => onNavigate('notifications'),\n                onNavigate\n              })\n            : child\n        )}"""
          if old not in text:
              print('AccountPanel already repaired or pattern not present; no change.')
          else:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('AccountPanel repaired.')
          PY

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- src/App.js; then
            echo 'No change to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.js
          git commit -m 'fix(ui): prevent AccountPanel black screen [auto-repair]'
          git push
