name: PreçoFixo17 Guardian

on:
  push:
    branches: [main]
    paths:
      - 'routes/**'
      - 'server.js'
      - '.github/workflows/precofixo17-guardian.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check production services
        id: health
        shell: bash
        run: |
          set -u
          BACKEND='https://uber-clone-backend-production.up.railway.app/health'
          FRONTEND='https://uber-clone-web.vercel.app/'
          backend_code=$(curl -L -sS --max-time 20 -o /tmp/backend.json -w '%{http_code}' "$BACKEND" || true)
          frontend_code=$(curl -L -sS --max-time 20 -o /tmp/frontend.html -w '%{http_code}' "$FRONTEND" || true)
          echo "backend_code=$backend_code" >> "$GITHUB_OUTPUT"
          echo "frontend_code=$frontend_code" >> "$GITHUB_OUTPUT"
          echo "Backend HTTP: $backend_code"
          echo "Frontend HTTP: $frontend_code"
          if [ "$backend_code" != "200" ] || [ "$frontend_code" != "200" ]; then
            exit 1
          fi

      - name: AI incident diagnosis
        if: failure()
        id: diagnosis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BACKEND_CODE: ${{ steps.health.outputs.backend_code }}
          FRONTEND_CODE: ${{ steps.health.outputs.frontend_code }}
        shell: bash
        run: |
          set -e
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            printf '%s\n' 'Diagnóstico IA não executado: OPENAI_API_KEY não configurada.' > /tmp/diagnosis.txt
            exit 0
          fi
          python - <<'PY'
          import json, os, urllib.request
          prompt = f"Você é o agente de confiabilidade do PreçoFixo17. O monitor detectou falha em produção. Backend HTTP={os.environ.get('BACKEND_CODE')}; Frontend HTTP={os.environ.get('FRONTEND_CODE')}. Dê diagnóstico curto, risco e ação segura. Não invente fatos nem recomende ações destrutivas."
          body = json.dumps({"model":"gpt-5-mini","input":prompt,"max_output_tokens":500}).encode()
          req = urllib.request.Request('https://api.openai.com/v1/responses', data=body, headers={'Content-Type':'application/json','Authorization':'Bearer '+os.environ['OPENAI_API_KEY']})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  data=json.load(r)
              text=data.get('output_text','IA não retornou diagnóstico.')
          except Exception as e:
              text='Falha ao consultar IA: '+str(e)
          open('/tmp/diagnosis.txt','w').write(text)
          PY

      - name: Create incident for complex/manual remediation
        if: failure()
        uses: actions/github-script@v7
        env:
          BACKEND_CODE: ${{ steps.health.outputs.backend_code }}
          FRONTEND_CODE: ${{ steps.health.outputs.frontend_code }}
        with:
          script: |
            const fs = require('fs');
            const diagnosis = fs.existsSync('/tmp/diagnosis.txt') ? fs.readFileSync('/tmp/diagnosis.txt','utf8') : 'Sem diagnóstico disponível.';
            const title = `Guardian PreçoFixo17: incidente em produção (${new Date().toISOString()})`;
            const body = [
              '## Guardian PreçoFixo17',
              '',
              `- Backend HTTP: ${process.env.BACKEND_CODE || 'desconhecido'}`,
              `- Frontend HTTP: ${process.env.FRONTEND_CODE || 'desconhecido'}`,
              `- Execução: ${context.runId}`,
              '',
              '### Diagnóstico',
              diagnosis,
              '',
              '> O Guardian não executa alterações destrutivas automaticamente. Incidentes complexos ficam registrados para correção segura.'
            ].join('\n');
            await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body}).catch(() => {});
